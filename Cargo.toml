[package]
name = "koxi"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.6", features = ["env"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
statrs = "0.19.1"
streaming-iterator = "0.1.9"
tempfile = "3.27.0"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-rust = "0.24.2"
